name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -r build/requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Lint (shellcheck)
        run: shellcheck build/*.sh
      - name: Test
        run: pytest -q
      - name: Dependency audit
        # PYSEC-2022-252 is a project-wide advisory for a malicious release
        # published after a maintainer account takeover; it has no fixed
        # version and 1.11.4 is the latest release.
        run: pip-audit -r build/requirements.txt --ignore-vuln PYSEC-2022-252
